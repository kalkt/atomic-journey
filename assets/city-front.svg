<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" preserveAspectRatio="xMidYMax slice">
  <defs>
    <filter id="front-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sharp-glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fg-bldg-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#080412"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <linearGradient id="fg-bldg-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c0620"/>
      <stop offset="100%" stop-color="#040210"/>
    </linearGradient>
    <radialGradient id="win-neon-pur" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff00ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#880088" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="win-neon-grn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#004433" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="win-neon-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3300" stop-opacity="1"/>
      <stop offset="100%" stop-color="#440800" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- ════ FAR-LEFT FOREGROUND BLOCK ════ -->
  <g filter="url(#front-glow)">
    <!-- Massive left anchor building -->
    <rect x="0"   y="420" width="180" height="380" fill="url(#fg-bldg-dark)"/>
    <!-- Tactical edge lines -->
    <line x1="180" y1="420" x2="180" y2="800" stroke="#cc00ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="0"   y1="420" x2="180" y2="420" stroke="#cc00ff" stroke-width="1"   opacity="0.3"/>
    <!-- Floor lines -->
    <line x1="0" y1="470" x2="180" y2="470" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
    <line x1="0" y1="520" x2="180" y2="520" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
    <line x1="0" y1="570" x2="180" y2="570" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
    <line x1="0" y1="620" x2="180" y2="620" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
    <!-- Windows -->
    <g filter="url(#sharp-glow)">
      <rect x="15"  y="435" width="16" height="10" fill="url(#win-neon-pur)" rx="1">
        <animate attributeName="opacity" values="1;0.2;0.8;1" dur="3.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="38"  y="435" width="16" height="10" fill="url(#win-neon-grn)" rx="1" opacity="0.7"/>
      <rect x="61"  y="435" width="16" height="10" fill="url(#win-neon-pur)" rx="1" opacity="0.9"/>
      <rect x="84"  y="435" width="16" height="10" fill="url(#win-neon-red)" rx="1">
        <animate attributeName="opacity" values="0.5;1;0.3;0.8;0.5" dur="4.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="107" y="435" width="16" height="10" fill="url(#win-neon-grn)" rx="1" opacity="0.6"/>
      <rect x="130" y="435" width="16" height="10" fill="url(#win-neon-pur)" rx="1" opacity="0.8"/>
      <rect x="153" y="435" width="16" height="10" fill="url(#win-neon-grn)" rx="1">
        <animate attributeName="opacity" values="0.8;0.1;0.7;0.8" dur="6.3s" repeatCount="indefinite"/>
      </rect>

      <rect x="15"  y="455" width="16" height="10" fill="url(#win-neon-grn)" rx="1" opacity="0.5"/>
      <rect x="38"  y="455" width="16" height="10" fill="url(#win-neon-pur)" rx="1" opacity="0.8"/>
      <rect x="61"  y="455" width="16" height="10" fill="url(#win-neon-red)" rx="1">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="84"  y="455" width="16" height="10" fill="url(#win-neon-grn)" rx="1" opacity="0.6"/>
      <rect x="107" y="455" width="16" height="10" fill="url(#win-neon-pur)" rx="1" opacity="0.7"/>
      <rect x="130" y="455" width="16" height="10" fill="url(#win-neon-grn)" rx="1" opacity="0.9"/>
      <rect x="153" y="455" width="16" height="10" fill="url(#win-neon-red)" rx="1" opacity="0.4"/>
    </g>
    <!-- Neon roof accent -->
    <rect x="0" y="420" width="180" height="3" fill="#cc00ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <!-- Corner tactical bracket -->
    <polyline points="180,440 200,440 200,460" fill="none" stroke="#cc00ff" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- ════ LEFT-CENTER BLOCK ════ -->
  <g filter="url(#front-glow)">
    <rect x="220" y="380" width="140" height="420" fill="url(#fg-bldg-mid)"/>
    <rect x="220" y="380" width="140" height="3"   fill="#00ffaa" opacity="0.6"/>
    <line x1="360" y1="380" x2="360" y2="800" stroke="#00ffaa" stroke-width="1.2" opacity="0.3"/>
    <!-- Vertical data conduit -->
    <rect x="355" y="380" width="3" height="420" fill="#00ffaa" opacity="0.08"/>
    <!-- Windows -->
    <g filter="url(#sharp-glow)">
      <rect x="233" y="395" width="18" height="11" fill="url(#win-neon-grn)" rx="1" opacity="0.9"/>
      <rect x="257" y="395" width="18" height="11" fill="url(#win-neon-pur)" rx="1">
        <animate attributeName="opacity" values="0.9;0.2;0.8;0.9" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="281" y="395" width="18" height="11" fill="url(#win-neon-red)" rx="1" opacity="0.5"/>
      <rect x="305" y="395" width="18" height="11" fill="url(#win-neon-grn)" rx="1" opacity="0.7"/>
      <rect x="329" y="395" width="18" height="11" fill="url(#win-neon-pur)" rx="1" opacity="0.8"/>

      <rect x="233" y="416" width="18" height="11" fill="url(#win-neon-pur)" rx="1" opacity="0.6"/>
      <rect x="257" y="416" width="18" height="11" fill="url(#win-neon-grn)" rx="1" opacity="0.9"/>
      <rect x="281" y="416" width="18" height="11" fill="url(#win-neon-pur)" rx="1">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="305" y="416" width="18" height="11" fill="url(#win-neon-red)" rx="1" opacity="0.5"/>
      <rect x="329" y="416" width="18" height="11" fill="url(#win-neon-grn)" rx="1" opacity="0.7"/>
    </g>
    <!-- Neon ledge strips -->
    <rect x="220" y="440" width="140" height="1" fill="#00ffaa" opacity="0.15"/>
    <rect x="220" y="500" width="140" height="1" fill="#00ffaa" opacity="0.12"/>
    <rect x="220" y="560" width="140" height="1" fill="#00ffaa" opacity="0.1"/>
    <!-- Roof antenna -->
    <line x1="290" y1="380" x2="290" y2="340" stroke="#00ffaa" stroke-width="1.5" opacity="0.7"/>
    <circle cx="290" cy="338" r="3.5" fill="#00ffaa">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ════ CENTER-DOMINANT TOWER ════ -->
  <g filter="url(#front-glow)">
    <rect x="700" y="300" width="200" height="500" fill="url(#fg-bldg-dark)"/>
    <rect x="700" y="300" width="200" height="4"   fill="#cc00ff" opacity="0.9"/>
    <!-- Vertical tactical lines -->
    <line x1="700" y1="300" x2="700" y2="800" stroke="#cc00ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="900" y1="300" x2="900" y2="800" stroke="#cc00ff" stroke-width="1.5" opacity="0.35"/>
    <!-- Floor separators -->
    <line x1="700" y1="380" x2="900" y2="380" stroke="#ffffff" stroke-width="0.6" opacity="0.06"/>
    <line x1="700" y1="460" x2="900" y2="460" stroke="#ffffff" stroke-width="0.6" opacity="0.06"/>
    <line x1="700" y1="540" x2="900" y2="540" stroke="#ffffff" stroke-width="0.6" opacity="0.06"/>
    <line x1="700" y1="620" x2="900" y2="620" stroke="#ffffff" stroke-width="0.6" opacity="0.06"/>
    <line x1="700" y1="700" x2="900" y2="700" stroke="#ffffff" stroke-width="0.6" opacity="0.06"/>
    <!-- Windows center tower -->
    <g filter="url(#sharp-glow)">
      <rect x="716" y="318" width="20" height="12" fill="url(#win-neon-pur)" rx="1" opacity="0.9"/>
      <rect x="742" y="318" width="20" height="12" fill="url(#win-neon-grn)" rx="1">
        <animate attributeName="opacity" values="1;0.2;0.8;1" dur="2.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="768" y="318" width="20" height="12" fill="url(#win-neon-pur)" rx="1" opacity="0.7"/>
      <rect x="794" y="318" width="20" height="12" fill="url(#win-neon-red)" rx="1" opacity="0.5"/>
      <rect x="820" y="318" width="20" height="12" fill="url(#win-neon-grn)" rx="1" opacity="0.8"/>
      <rect x="846" y="318" width="20" height="12" fill="url(#win-neon-pur)" rx="1">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="872" y="318" width="20" height="12" fill="url(#win-neon-red)" rx="1" opacity="0.4"/>

      <rect x="716" y="340" width="20" height="12" fill="url(#win-neon-grn)" rx="1" opacity="0.6"/>
      <rect x="742" y="340" width="20" height="12" fill="url(#win-neon-pur)" rx="1" opacity="0.9"/>
      <rect x="768" y="340" width="20" height="12" fill="url(#win-neon-red)" rx="1">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="794" y="340" width="20" height="12" fill="url(#win-neon-grn)" rx="1" opacity="0.8"/>
      <rect x="820" y="340" width="20" height="12" fill="url(#win-neon-pur)" rx="1" opacity="0.7"/>
      <rect x="846" y="340" width="20" height="12" fill="url(#win-neon-grn)" rx="1" opacity="0.5"/>
      <rect x="872" y="340" width="20" height="12" fill="url(#win-neon-pur)" rx="1" opacity="0.8"/>
    </g>
    <!-- Pulsing roof line -->
    <rect x="700" y="300" width="200" height="4" fill="#cc00ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- Corner tactical brackets center -->
    <polyline points="700,320 680,320 680,340" fill="none" stroke="#cc00ff" stroke-width="1.5" opacity="0.5"/>
    <polyline points="900,320 920,320 920,340" fill="none" stroke="#cc00ff" stroke-width="1.5" opacity="0.5"/>
    <polyline points="700,780 680,780 680,760" fill="none" stroke="#cc00ff" stroke-width="1"   opacity="0.3"/>
    <polyline points="900,780 920,780 920,760" fill="none" stroke="#cc00ff" stroke-width="1"   opacity="0.3"/>
  </g>

  <!-- ════ RIGHT-CENTER BLOCK ════ -->
  <g filter="url(#front-glow)">
    <rect x="1300" y="360" width="160" height="440" fill="url(#fg-bldg-mid)"/>
    <rect x="1300" y="360" width="160" height="3"   fill="#ff00ff" opacity="0.7"/>
    <line x1="1300" y1="360" x2="1300" y2="800" stroke="#ff00ff" stroke-width="1" opacity="0.3"/>
    <line x1="1460" y1="360" x2="1460" y2="800" stroke="#ff00ff" stroke-width="1" opacity="0.3"/>
    <g filter="url(#sharp-glow)">
      <rect x="1314" y="376" width="18" height="11" fill="url(#win-neon-pur)" rx="1" opacity="0.9"/>
      <rect x="1338" y="376" width="18" height="11" fill="url(#win-neon-grn)" rx="1">
        <animate attributeName="opacity" values="0.9;0.1;0.7;0.9" dur="4.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="1362" y="376" width="18" height="11" fill="url(#win-neon-red)" rx="1" opacity="0.5"/>
      <rect x="1386" y="376" width="18" height="11" fill="url(#win-neon-pur)" rx="1" opacity="0.7"/>
      <rect x="1410" y="376" width="18" height="11" fill="url(#win-neon-grn)" rx="1" opacity="0.8"/>
      <rect x="1434" y="376" width="18" height="11" fill="url(#win-neon-pur)" rx="1">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="1314" y="397" width="18" height="11" fill="url(#win-neon-red)" rx="1" opacity="0.4"/>
      <rect x="1338" y="397" width="18" height="11" fill="url(#win-neon-pur)" rx="1" opacity="0.8"/>
      <rect x="1362" y="397" width="18" height="11" fill="url(#win-neon-grn)" rx="1" opacity="0.6"/>
      <rect x="1386" y="397" width="18" height="11" fill="url(#win-neon-pur)" rx="1">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="1410" y="397" width="18" height="11" fill="url(#win-neon-red)" rx="1" opacity="0.5"/>
      <rect x="1434" y="397" width="18" height="11" fill="url(#win-neon-grn)" rx="1" opacity="0.7"/>
    </g>
  </g>

  <!-- ════ FAR-RIGHT FOREGROUND BLOCK ════ -->
  <g filter="url(#front-glow)">
    <rect x="1740" y="400" width="180" height="400" fill="url(#fg-bldg-dark)"/>
    <rect x="1740" y="400" width="180" height="3"   fill="#cc00ff" opacity="0.8"/>
    <line x1="1740" y1="400" x2="1740" y2="800" stroke="#cc00ff" stroke-width="1.5" opacity="0.4"/>
    <g filter="url(#sharp-glow)">
      <rect x="1754" y="416" width="16" height="10" fill="url(#win-neon-pur)" rx="1" opacity="0.9"/>
      <rect x="1776" y="416" width="16" height="10" fill="url(#win-neon-grn)" rx="1">
        <animate attributeName="opacity" values="1;0.2;0.9;1" dur="3.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="1798" y="416" width="16" height="10" fill="url(#win-neon-red)" rx="1" opacity="0.6"/>
      <rect x="1820" y="416" width="16" height="10" fill="url(#win-neon-pur)" rx="1" opacity="0.8"/>
      <rect x="1842" y="416" width="16" height="10" fill="url(#win-neon-grn)" rx="1" opacity="0.5"/>
      <rect x="1864" y="416" width="16" height="10" fill="url(#win-neon-pur)" rx="1">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="1754" y="436" width="16" height="10" fill="url(#win-neon-grn)" rx="1" opacity="0.6"/>
      <rect x="1776" y="436" width="16" height="10" fill="url(#win-neon-pur)" rx="1" opacity="0.8"/>
      <rect x="1798" y="436" width="16" height="10" fill="url(#win-neon-grn)" rx="1">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="4.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="1820" y="436" width="16" height="10" fill="url(#win-neon-red)" rx="1" opacity="0.5"/>
    </g>
    <rect x="1740" y="400" width="180" height="3" fill="#cc00ff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ════ GROUND / STREET LEVEL ════ -->
  <rect x="0" y="780" width="1920" height="20" fill="#050210"/>
  <!-- Street neon reflections -->
  <rect x="0" y="785" width="1920" height="1" fill="#cc00ff" opacity="0.08"/>
  <ellipse cx="290"  cy="790" rx="80"  ry="4" fill="#00ffaa" opacity="0.06"/>
  <ellipse cx="800"  cy="790" rx="120" ry="5" fill="#cc00ff" opacity="0.07"/>
  <ellipse cx="1380" cy="790" rx="90"  ry="4" fill="#ff00ff" opacity="0.06"/>
  <ellipse cx="1840" cy="790" rx="70"  ry="3" fill="#cc00ff" opacity="0.05"/>
</svg>
